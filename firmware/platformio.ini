; Density firmware.
; Board environment(s) are maintained by the platform work; the native_* environments
; build lib/core on the Mac and run the unit tests in test/.
[platformio]
default_envs = native

[native_base]
platform = native
build_flags = -std=gnu++17 -Wall -Wextra -I test/support
lib_deps = bblanchon/ArduinoJson@^7
test_framework = unity
lib_compat_mode = off
; src/ is Arduino code for the boards; never build it natively.
build_src_filter = -<*>

; All tests (integration).
[env:native]
extends = native_base

; One environment per area so parallel work does not share a build folder.
[env:native_engine]
extends = native_base
test_filter = test_engine

[env:native_config]
extends = native_base
test_filter = test_config, test_leds

[env:native_ui]
extends = native_base
test_filter = test_ui

; ---------------------------------------------------------------------------
; Prototype board: Waveshare RP2350-Zero (RP2350A, 4 MB flash) on the 125 x 130 board.
; Owned by the platform work. Build: pio run -e density_proto
; Platform: maxgerhardt fork (the official platformio/raspberrypi has no RP2350 support),
; pinned to a commit; it pins arduino-pico 6.1.0 (earlephilhower core).
[env:density_proto]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#5d4561a05e3b212660ac6fdd3fbfb328d1988aa1
board = waveshare_rp2350_zero
framework = arduino
board_build.core = earlephilhower
; 4 MB flash: 3 MB sketch, 1 MB LittleFS (config.json and calibration files).
board_build.filesystem = littlefs
board_build.filesystem_size = 1m
; Pico SDK USB stack (the default; no -DUSE_TINYUSB): CDC serial + MIDI via MIDIUSB.
; lib/core (the portable application) is built in; src/app.cpp forwards to it.
; The framework already compiles C++ as -std=gnu++17.
build_flags =
    -Wall
    -I lib/core/include
    -I lib/core/src
lib_deps =
    bblanchon/ArduinoJson@^7
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.12.1
    adafruit/Adafruit BusIO@^1.17.0
monitor_speed = 115200

; Same firmware, always in hardware test mode (even after the app is integrated).
[env:density_proto_hwtest]
extends = env:density_proto
lib_ignore = density-core
build_flags =
    ${env:density_proto.build_flags}
    -DDENSITY_HW_TEST
